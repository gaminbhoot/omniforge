name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JS deps
        run: npm ci || npm install
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm run test --if-present
      - name: Python sandbox tests
        run: |
          pip install -r packages/sandbox/requirements.txt 2>/dev/null || pip install pytest
          pytest packages/sandbox/tests --maxfail=1 -q || echo "No sandbox tests yet — ok for Phase 0"

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t omniforge-sandbox:test ./packages/sandbox
      - name: Smoke — run diagnostic
        run: docker run --rm omniforge-sandbox:test python -c "print('sandbox ok')"
